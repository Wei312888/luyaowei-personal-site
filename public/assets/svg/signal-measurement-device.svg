<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="smd-title smd-desc" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif">
  <title id="smd-title">周期信号测量分析装置 · 系统框图</title>
  <desc id="smd-desc">简易示波器:从待测信号经前端调理、AD9226 采集、TIM2/DMA 采样控制到 FIR 滤波与 FFT 分析,最终获得测量指标并显示;含干扰监测增益校正与 GPIO 调试工具。</desc>

  <defs>
    <marker id="smdArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="smdArrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#002FA7"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <g>
    <text x="80" y="44" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="14" letter-spacing="2" fill="#002FA7">BLOCK DIAGRAM · 信号测量</text>
    <text x="80" y="84" font-family="&quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,&quot;SimSun&quot;,serif" font-size="32" fill="#1A1A1A">周期信号测量分析装置</text>
    <text x="80" y="110" font-size="14" fill="#6F6C64">STM32H743 + AD9226 · 采集 → 滤波 → FFT → 测量 · 按键后 1 秒内显示</text>
  </g>

  <!-- 信号链(6 节点) -->
  <g>
    <!-- 1 待测信号 -->
    <g>
      <rect x="86" y="150" width="148" height="120" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="160" y="192" text-anchor="middle" font-size="16" fill="#1A1A1A">待测信号</text>
      <text x="160" y="216" text-anchor="middle" font-size="12" fill="#6F6C64">周期信号输入</text>
      <text x="160" y="240" text-anchor="middle" font-size="12" fill="#6F6C64">正弦 / 三角 / 方波</text>
    </g>
    <!-- 2 前端调理 -->
    <g>
      <rect x="262" y="150" width="148" height="120" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="336" y="190" text-anchor="middle" font-size="16" fill="#1A1A1A">前端调理</text>
      <text x="336" y="214" text-anchor="middle" font-size="12" fill="#6F6C64">50Ω 阻抗匹配</text>
      <text x="336" y="236" text-anchor="middle" font-size="12" fill="#6F6C64">前端增益标定</text>
    </g>
    <!-- 3 AD9226 -->
    <g>
      <rect x="438" y="150" width="148" height="120" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="512" y="190" text-anchor="middle" font-size="16" fill="#1A1A1A">AD9226 ADC</text>
      <text x="512" y="214" text-anchor="middle" font-size="12" fill="#6F6C64">12 位并行采集</text>
      <text x="512" y="236" text-anchor="middle" font-size="12" fill="#6F6C64">数据线重映射</text>
    </g>
    <!-- 4 采样控制 -->
    <g>
      <rect x="614" y="150" width="148" height="120" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="688" y="190" text-anchor="middle" font-size="16" fill="#1A1A1A">采样控制</text>
      <text x="688" y="214" text-anchor="middle" font-size="12" fill="#6F6C64">TIM2 输出 8MHz</text>
      <text x="688" y="236" text-anchor="middle" font-size="12" fill="#6F6C64">DMA 并行采样</text>
    </g>
    <!-- 5 数字信号处理 -->
    <g>
      <rect x="790" y="150" width="148" height="120" fill="#FFFFFF" stroke="#002FA7" stroke-width="1.5"/>
      <text x="864" y="186" text-anchor="middle" font-size="16" fill="#002FA7">数字信号处理</text>
      <text x="864" y="208" text-anchor="middle" font-size="11" fill="#6F6C64">96 阶 Kaiser FIR 抗混叠</text>
      <text x="864" y="228" text-anchor="middle" font-size="11" fill="#6F6C64">4 倍抽取 · Hann 窗 FFT</text>
      <text x="864" y="248" text-anchor="middle" font-size="11" fill="#6F6C64">频率分辨率 488Hz</text>
    </g>
    <!-- 6 测量与显示 -->
    <g>
      <rect x="966" y="150" width="148" height="120" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="1040" y="190" text-anchor="middle" font-size="16" fill="#1A1A1A">测量与显示</text>
      <text x="1040" y="214" text-anchor="middle" font-size="11" fill="#6F6C64">Vpp / 真有效值 / 基频</text>
      <text x="1040" y="234" text-anchor="middle" font-size="11" fill="#6F6C64">识别基波与 2–5 次谐波</text>
      <text x="1040" y="254" text-anchor="middle" font-size="11" fill="#6F6C64">串口屏 1 秒内显示</text>
    </g>
  </g>

  <!-- 信号链箭头 -->
  <g stroke="#1A1A1A" stroke-width="1.1" fill="none">
    <line x1="234" y1="210" x2="258" y2="210" marker-end="url(#smdArr)"/>
    <line x1="410" y1="210" x2="434" y2="210" marker-end="url(#smdArr)"/>
    <line x1="586" y1="210" x2="610" y2="210" marker-end="url(#smdArr)"/>
    <line x1="762" y1="210" x2="786" y2="210" marker-end="url(#smdArr)"/>
    <line x1="938" y1="210" x2="962" y2="210" marker-end="url(#smdArr)"/>
  </g>

  <!-- 干扰监测 → 高频增益校正 反馈 -->
  <g stroke="#002FA7" stroke-width="1.1" fill="none">
    <polyline points="864,270 864,310 336,310 336,274" marker-end="url(#smdArrAcc)"/>
  </g>
  <text x="360" y="304" font-size="13" fill="#002FA7">实时监测干扰 → 启用高频增益校正</text>

  <!-- 指标三列 -->
  <g>
    <!-- 测量指标 -->
    <g>
      <rect x="80" y="356" width="360" height="150" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="98" y="384" font-size="15" fill="#002FA7">测量指标</text>
      <text x="98" y="410" font-size="12" fill="#1A1A1A">Vpp / 真有效值 / 基频 / 谐波幅值</text>
      <text x="98" y="434" font-size="12" fill="#1A1A1A">误差 ≤ 1mV · 基频误差 ≤ 0.5kHz</text>
      <text x="98" y="458" font-size="12" fill="#1A1A1A">频率分辨率 488Hz</text>
      <text x="98" y="482" font-size="12" fill="#1A1A1A">按键后 1 秒内显示</text>
    </g>
    <!-- 关键点实测 -->
    <g>
      <rect x="480" y="356" width="280" height="150" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="498" y="384" font-size="15" fill="#002FA7">关键点实测</text>
      <text x="498" y="410" font-size="12" fill="#1A1A1A">500kHz / 250mVpp</text>
      <text x="498" y="432" font-size="12" fill="#1A1A1A">误差约 1mV</text>
      <text x="498" y="458" font-size="12" fill="#1A1A1A">可采集三角波 / 方波</text>
      <text x="498" y="480" font-size="12" fill="#1A1A1A">滤出 600kHz 干扰杂波</text>
    </g>
    <!-- 硬件与调试 -->
    <g>
      <rect x="800" y="356" width="320" height="150" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="818" y="384" font-size="15" fill="#002FA7">硬件与调试</text>
      <text x="818" y="410" font-size="12" fill="#1A1A1A">50Ω 阻抗匹配 · 增益标定</text>
      <text x="818" y="432" font-size="12" fill="#1A1A1A">12 位并行数据线重映射</text>
      <text x="818" y="458" font-size="12" fill="#1A1A1A">GPIO 扫描工具</text>
      <text x="818" y="480" font-size="12" fill="#6F6C64">定位虚焊 / 错线</text>
    </g>
  </g>

  <!-- 页脚 -->
  <text x="80" y="540" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="11" fill="#6F6C64">真实可画的系统框图 · 依据站主确认口径 · 非截图</text>
</svg>
