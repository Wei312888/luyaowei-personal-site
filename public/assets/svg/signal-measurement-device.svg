    <!-- 根节点 -->
    <g>
      <rect x="36" y="305" width="244" height="150" fill="#FFFFFF" stroke="#002FA7" stroke-width="1.5"/>
      <text x="52" y="331" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="10.5" letter-spacing="2" fill="#002FA7">PROJECT MIND MAP</text>
      <text x="52" y="361" font-family="&quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,&quot;SimSun&quot;,serif" font-size="19" fill="#1A1A1A">周期信号测量</text>
      <text x="52" y="387" font-family="&quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,&quot;SimSun&quot;,serif" font-size="19" fill="#1A1A1A">分析装置</text>
    </g>
    <g>
      <rect x="340" y="140" width="400" height="168" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="356" y="166" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="11" letter-spacing="2" fill="#002FA7">01 / 定位</text>
      <text x="356" y="192" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">10–500 kHz、50–250 mVpp 基波+1~2 次谐波测量；</text>
      <text x="356" y="210" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">抑制 ≥1 MHz 单频干扰；单路 5 V 供电；</text>
      <text x="356" y="228" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">按键 2 秒内显示全部数据</text>
      <text x="356" y="246" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">(2026 电赛区赛 G 题 · 独立完成)</text>
    </g>
    <g>
      <rect x="790" y="231" width="400" height="168" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="806" y="257" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="11" letter-spacing="2" fill="#002FA7">02 / 系统链路</text>
      <text x="806" y="283" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">加法器 50Ω 匹配 + 电压跟随器 →</text>
      <text x="806" y="301" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">AD9226(12bit/8MSPS) → TIM2 触发 DMA</text>
      <text x="806" y="319" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">GPIO 并行采样 16512 点 →</text>
      <text x="806" y="337" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">96 阶 Kaiser FIR + 4 倍抽取 →</text>
      <text x="806" y="355" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">时域测量 + 4096 点 FFT(Hann) →</text>
      <text x="806" y="373" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">串口屏波形与线谱</text>
    </g>
    <g>
      <rect x="340" y="322" width="400" height="168" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="356" y="348" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="11" letter-spacing="2" fill="#002FA7">03 / 核心算法与理论</text>
      <text x="356" y="374" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">FFT 谱峰 + 抛物线/任意频率窗 DFT 细化</text>
      <text x="356" y="392" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">幅值相位；时域 Vpp 与频域重构交叉校验；</text>
      <text x="356" y="410" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">Goertzel 定点监测 1/2 MHz 滤波前后残余；</text>
      <text x="356" y="428" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">350–500 kHz 手动高频增益校正；</text>
      <text x="356" y="446" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">低幅值波形 FFT 重建 + Catmull-Rom 平滑</text>
    </g>
    <g>
      <rect x="790" y="413" width="400" height="168" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="806" y="439" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="11" letter-spacing="2" fill="#002FA7">04 / 关键指标</text>
      <text x="806" y="465" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">幅值误差 ≤5 mV · 基频误差 ≤1 kHz</text>
      <text x="806" y="483" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">· 分辨率 488 Hz · 2 s 内显示；</text>
      <text x="806" y="501" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">500 kHz/250 mVpp 关键点误差约 2 mV；</text>
      <text x="806" y="519" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">≥1 MHz 干扰下 FIR 衰减 ≈44 dB 仍达标</text>
    </g>
    <g>
      <rect x="340" y="504" width="400" height="168" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="356" y="530" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="11" letter-spacing="2" fill="#002FA7">05 / 关键难点</text>
      <text x="356" y="556" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">并行位线虚焊/错线 → GPIO 扫描重映射；</text>
      <text x="356" y="574" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">谐波“测不到”属频带设计(&gt;500 kHz 不在题内)；</text>
      <text x="356" y="592" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">低幅值量化台阶 → FFT 重建平滑显示；</text>
      <text x="356" y="610" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">自动干扰校正误触发 → 手动 HF CORR</text>
    </g>
    <g>
      <rect x="790" y="595" width="400" height="168" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="806" y="621" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="11" letter-spacing="2" fill="#002FA7">06 / 测试与实测</text>
      <text x="806" y="647" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">9 组纯正弦 Vpp/Vrms 全达标；</text>
      <text x="806" y="665" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">基波+谐波定量分量误差 ≤5 mV；</text>
      <text x="806" y="683" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">1/2 MHz 干扰 FIR 后衰减约 44 dB；</text>
      <text x="806" y="701" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">整机闭环与示波器对照一致</text>
    </g>
    <g>
      <rect x="340" y="686" width="400" height="168" fill="#FFFFFF" stroke="#E7E4DB"/>
      <text x="356" y="712" font-family="ui-monospace,&quot;SF Mono&quot;,Consolas,monospace" font-size="11" letter-spacing="2" fill="#002FA7">07 / 复盘与收获</text>
      <text x="356" y="738" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">独立走通「并行 ADC+DMA → 多速率滤波 →</text>
      <text x="356" y="756" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">FFT 工程细化 → 整机标定 → 串口屏联调」</text>
      <text x="356" y="774" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">完整测量链路；保留 VOFA+ 与 GPIO 诊断</text>
      <text x="356" y="792" font-family="-apple-system,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif" font-size="11.5" fill="#1A1A1A">能力，收获小信号整机标定方法</text>
    </g>
  <!-- 页脚 -->
